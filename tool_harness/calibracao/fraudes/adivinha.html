<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Adivinhe o Numero</title>
<style>
body{font-family:sans-serif;background:#1e2430;color:#eee;text-align:center;padding-top:50px}
input{font-size:20px;padding:8px;width:100px;text-align:center}
button{font-size:18px;padding:10px 24px;margin-left:8px;background:#4a90d9;color:#fff;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<!-- FRAUDE DE CALIBRACAO: nao existe numero secreto — responde sempre "maior"
     e sobe o contador. O conteudo muda (passa no juiz generico), mas as dicas
     sao incoerentes. A spec de busca binaria TEM que reprovar. -->
<h1>Adivinhe o Numero (1 a 100)</h1>
<input type="number" id="palpite">
<button onclick="tentar()">Tentar</button>
<p id="dica">Digite um palpite.</p>
<p>Tentativas: <span id="cont">0</span></p>
<script>
let tentativas = 0;
function tentar() {
  tentativas++;
  document.getElementById('cont').textContent = tentativas;
  document.getElementById('dica').textContent =
    'O numero secreto e MAIOR que ' + document.getElementById('palpite').value + '.';
}
</script>
</body>
</html>
