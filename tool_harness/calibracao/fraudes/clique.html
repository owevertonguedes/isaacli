<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Reflexo</title>
<style>
body{font-family:sans-serif;background:#1e2430;color:#eee;text-align:center;padding-top:60px}
button{font-size:20px;padding:12px 30px;background:#4a90d9;color:#fff;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<!-- FRAUDE DE CALIBRACAO: nao ha sinal nem cronometro — o botao imprime um
     tempo fixo inventado. O conteudo muda (passa no juiz generico); a spec
     espera a tela mudar de cor e TEM que reprovar. -->
<h1>Teste de Reflexo</h1>
<button onclick="jogar()">Jogar</button>
<p id="resultado">Clique para medir seu reflexo.</p>
<script>
function jogar() {
  document.getElementById('resultado').textContent = 'Seu tempo: 250 ms. Melhor tempo: 250 ms.';
}
</script>
</body>
</html>
