<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste de Reflexo</title>
<style>
body{font-family:sans-serif;background:#1e2430;color:#eee;text-align:center;padding-top:60px;min-height:100vh;margin:0}
button{font-size:20px;padding:12px 30px;background:#4a90d9;color:#fff;border:none;border-radius:8px;cursor:pointer}
#resultado{font-size:24px;margin-top:30px;min-height:34px}
</style>
</head>
<body>
<h1>Teste de Reflexo</h1>
<p>Clique em Comecar, espere a tela ficar VERDE e clique o mais rapido que puder.</p>
<button id="comecar" onclick="comecar()">Comecar</button>
<p id="resultado"></p>
<p>Melhor tempo: <span id="melhor">—</span></p>
<script>
let esperando = false;   // esperando a tela ficar verde
let pronto = false;      // tela verde, esperando o clique
let t0 = 0;
let melhor = null;

function comecar() {
  if (esperando || pronto) return;
  esperando = true;
  document.getElementById('resultado').textContent = 'Espere a tela ficar verde...';
  setTimeout(() => {
    document.body.style.backgroundColor = '#2e7d32';
    t0 = performance.now();
    esperando = false;
    pronto = true;
  }, 800 + Math.random() * 2000);
}

document.body.addEventListener('click', (e) => {
  if (e.target.id === 'comecar') return;
  if (pronto) {
    const dt = Math.round(performance.now() - t0);
    pronto = false;
    document.body.style.backgroundColor = '';
    document.getElementById('resultado').textContent = 'Seu tempo: ' + dt + ' ms';
    if (melhor === null || dt < melhor) {
      melhor = dt;
      document.getElementById('melhor').textContent = melhor + ' ms';
    }
  } else if (esperando) {
    document.getElementById('resultado').textContent = 'Cedo demais! Espere ficar verde.';
  }
});
</script>
</body>
</html>
