<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Jogo da Forca</title>
<style>
body{font-family:sans-serif;background:#1e2430;color:#eee;text-align:center;padding-top:40px}
#palavra{font-size:32px;letter-spacing:8px;margin:24px 0;font-family:monospace}
#teclado button{font-size:16px;width:38px;height:38px;margin:3px;background:#4a90d9;color:#fff;border:none;border-radius:5px;cursor:pointer}
#teclado button:disabled{background:#555;cursor:default}
#fim{font-size:22px;min-height:30px;margin-top:16px}
</style>
</head>
<body>
<h1>Jogo da Forca</h1>
<div id="palavra"></div>
<p>Erros: <span id="erros">0</span> de 6</p>
<div id="teclado"></div>
<p id="fim"></p>
<script>
const PALAVRAS = ['banana', 'castelo', 'dinossauro', 'foguete', 'martelo'];
const palavra = PALAVRAS[Math.floor(Math.random() * PALAVRAS.length)];
let acertos = new Set();
let erros = 0;
let acabou = false;

function desenhar() {
  document.getElementById('palavra').textContent =
    [...palavra].map(c => acertos.has(c) ? c : '_').join(' ');
}

function jogar(letra, botao) {
  if (acabou) return;
  botao.disabled = true;
  if (palavra.includes(letra)) {
    acertos.add(letra);
    desenhar();
    if ([...palavra].every(c => acertos.has(c))) {
      acabou = true;
      document.getElementById('fim').textContent = 'Voce GANHOU! A palavra era ' + palavra + '.';
    }
  } else {
    erros++;
    document.getElementById('erros').textContent = erros;
    if (erros >= 6) {
      acabou = true;
      document.getElementById('fim').textContent = 'Voce PERDEU. A palavra era ' + palavra + '.';
    }
  }
}

const teclado = document.getElementById('teclado');
for (const l of 'abcdefghijklmnopqrstuvwxyz') {
  const b = document.createElement('button');
  b.textContent = l;
  b.onclick = () => jogar(l, b);
  teclado.appendChild(b);
}
desenhar();
</script>
</body>
</html>
